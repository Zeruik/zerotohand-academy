name: Publish verified patch release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Require verified same-commit packages and publish a new release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.cjs
